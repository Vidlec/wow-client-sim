# Checks every push and pull request: the TypeScript's types, Biome, the Lua's formatting and lint, its tests, the
# Lua tests that need nothing of the game (lua/tests), the native core (native/: formatting, clippy, its tests), and
# that the Docker image builds and starts. The scenarios need the game's files and interface source, which are not
# here: run them locally (bun src/cli/main.ts test).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The Lua: formatted as StyLua does it (stylua.toml), and clean in luacheck's eyes (.luacheckrc); locally both
      # are bun run lint:lua
      - name: Lua formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check lua scenarios tools

      - name: Lua lint
        uses: lunarmodules/luacheck@v1
        with:
          args: lua scenarios tools

      - name: Tests
        run: bun test

  # The Docker image (docs/docker.md): it builds, its LuaJIT and native core load, and its page answers
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t addonsim .

      - name: LuaJIT and the native core
        run: |
          docker run --rm addonsim luajit -e 'package.path = "lua/?.lua;" .. package.path; local native = require("native"); assert(native.handle(), "the native core did not load"); print("native core loaded")'

      - name: The page answers
        run: |
          docker run -d --name addonsim -p 8765:8765 addonsim
          for i in $(seq 1 60); do curl -fsS http://localhost:8765/api/setup > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:8765/api/setup | head -c 400
          docker logs addonsim
          docker rm -f addonsim

  # The native core (Rust): formatted, clean in clippy's eyes, its tests (the layout's rules, the store's frames)
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check
        run: |
          cargo fmt --check --manifest-path native/Cargo.toml
          cargo clippy --release --all-targets --manifest-path native/Cargo.toml -- -D warnings
          cargo test --release --manifest-path native/Cargo.toml

  # The Lua tests that need nothing of the game, on each system the releases are for (the boot cache reads each
  # system's own file data through the FFI). Windows is where it is developed, and checked there.
  lua:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install luajit; else sudo apt-get update -qq && sudo apt-get install -y -qq luajit; fi
          luajit -v

      - name: Lua tests
        run: luajit lua/tests/run.lua
