[package]
name = "addonsim_native"
version = "0.1.0"
edition = "2021"
description = "AddonSim's native core: the scene's walk and layout, the stream's item store and binary frames (loaded by LuaJIT's FFI)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
